global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    homeops_fleet: home
    homeops_server: container-host

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090
        labels:
          server_id: container-host

  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          server_id: container-host

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080
        labels:
          server_id: container-host

  - job_name: openvpn-server
    static_configs:
      - targets:
          - 192.168.86.25:9100
        labels:
          server_id: openvpn-server

  - job_name: ispy-server
    static_configs:
      - targets:
          - 192.168.86.27:9100
        labels:
          server_id: ispy-server
