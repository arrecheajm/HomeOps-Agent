{
  "schema_version": "1.0",
  "servers": {
    "container-host": {
      "cadvisor": {
        "classification": "keep",
        "rationale": "Useful container metrics source; retain while moving it to a pinned image and reviewed LAN exposure."
      },
      "filebrowser": {
        "classification": "retired",
        "rationale": "Removed through retire_disposable_containers on 2026-07-20 after the operator confirmed File Browser was empty and not wanted."
      },
      "monitoring-grafana-1": {
        "classification": "redeploy",
        "rationale": "Keep Grafana capability but start from clean provisioned state; the operator confirmed the basic dashboard and data do not need migration."
      },
      "monitoring-node_exporter-1": {
        "classification": "redeploy",
        "rationale": "Keep host metrics, but redeploy from desired state with a pinned image, restart policy, and reviewed port binding."
      },
      "monitoring-prometheus-1": {
        "classification": "redeploy",
        "rationale": "Keep Prometheus capability but start with a clean bounded-retention volume, pinned image, restart policy, and read-only configuration."
      },
      "mysql57": {
        "classification": "retired",
        "rationale": "Removed with dev-db_mysql_data on 2026-07-20 after the operator confirmed it contained disposable development-test data."
      },
      "nonprofit-postgres": {
        "classification": "retired",
        "rationale": "Removed with nonprofit_postgres_data on 2026-07-20 after the operator confirmed nonprofit_app was disposable development-test data."
      },
      "portainer": {
        "classification": "retire_later",
        "rationale": "Overlaps with the planned HomeOps lifecycle interface and has read-write Docker socket access; retain until replacement workflows are ready."
      },
      "watchtower": {
        "classification": "retire_later",
        "rationale": "Automatic updates conflict with planned pinned, approval-gated upgrades; retain until HomeOps upgrade actions replace it."
      }
    }
  }
}
